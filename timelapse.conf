# Time interval between snapshots (in seconds)
INTERVAL_SECONDS=5

# Stop date and time in 24-hour YYYY-MM-DD HH:MM format
END_TIME="2026-08-31 14:52"

# Target root directory to store captures
OUTPUT_DIR="/home/pi/projects/timelapse_draft2/test"

# Capture command templates (use $FILENAME directly where output path is required)
CAPTURE_CMD='rpicam-still -o "$FILENAME" --immediate -n'

# --- Video Rendering Settings ---
RENDER_VIDEO=true

# Remote rendering options
REMOTE_RENDER=true
REMOTE_USER="pi"
REMOTE_HOST="192.168.1.17"
REMOTE_PORT="22"
REMOTE_SSH_KEY="~/.ssh/id_rsa_pi_nas"
REMOTE_WORK_DIR="/tmp/rpi_timelapse_build"

# Temporary/local working video output path
VIDEO_OUTPUT="${OUTPUT_DIR}/timelapse_$(date '+%Y%m%d_%H%M%S').mp4"

# Local render command (used when REMOTE_RENDER=false)
RENDER_CMD='ffmpeg -y -f concat -safe 0 -i "$CONCAT_LIST" -c:v libx264 -pix_fmt yuv420p "$VIDEO_OUTPUT"'

# --- Final Video Storage Settings ---
# Enable final video relocation/transfer (true/false)
STORAGE_ENABLE=true

# Remote storage toggle (true = transfer/store on remote host via SSH/SCP, false = store in local directory)
STORAGE_REMOTE=true

# Remote Storage Server Settings (Can be the same or different from RENDER settings)
STORAGE_REMOTE_USER="pi"
STORAGE_REMOTE_HOST="192.168.1.17"
STORAGE_REMOTE_PORT="22"
STORAGE_REMOTE_SSH_KEY="~/.ssh/id_rsa_pi_nas"
STORAGE_REMOTE_DIR="/home/pi/media/timelapses"

# Local Storage Directory (Used if STORAGE_REMOTE=false)
STORAGE_LOCAL_DIR="/home/pi/timelapse_archive"
