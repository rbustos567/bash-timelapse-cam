# Time interval between snapshots (in seconds)
INTERVAL_SECONDS=10

# Stop date and time in 24-hour YYYY-MM-DD HH:MM format (e.g., "2026-09-02 18:00")
END_TIME="2026-08-29 18:46"

# Target root directory to store captures
OUTPUT_DIR="/home/pi/projects/timelapse/test_20260829"

# Capture command templates (use $FILENAME directly where the output path is required)
# Note: Use single quotes ('...') so $FILENAME is expanded dynamically at execution time.

# Option A: Picamera2 (Raspberry Pi Camera Module 3 / HQ)
CAPTURE_CMD='rpicam-still -o "$FILENAME" --immediate -n'

# Option B: fswebcam (Standard USB Webcams)
# CAPTURE_CMD='fswebcam -r 1920x1080 --no-banner "$FILENAME"'

# Option C: ffmpeg (V4L2 USB Webcams)
# CAPTURE_CMD='ffmpeg -y -f video4linux2 -i /dev/video0 -vframes 1 "$FILENAME"'

# Option D: Custom tool or binary
# CAPTURE_CMD='/usr/local/bin/custom_cam --device /dev/video1 --output "$FILENAME" --quality high'
